<!DOCTYPE html>
<html>
<head>
    <title>Smile Check AI</title>
</head>
<body>
    <h1>Upload a Photo of Your Smile</h1>
    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="image" accept="image/*" required><br><br>
        <input type="submit" value="Analyze">
    </form>

    {% if result %}
        <h2>{{ result }}</h2>
        <img src="{{ url_for('static', filename=result_image) }}" width="300">
    {% endif %}
</body>
</html>
